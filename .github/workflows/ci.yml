name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Calendar tests across host timezones
        run: |
          TZ=UTC npm test -- src/lib/tasks
          TZ=Asia/Manila npm test -- src/lib/tasks
          TZ=America/Los_Angeles npm test -- src/lib/tasks
      - name: Import boundaries
        run: npm run check:architecture
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start fresh local Supabase from migration history
        run: node scripts/start-test-supabase.mjs
      - name: Database policies and transactions
        run: supabase test db
      - name: Generated database types
        run: node scripts/check-db-types.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build and browser tests
        # Playwright builds with the same local public settings used at runtime.
        run: npm run test:e2e
      # Do not upload browser traces/reports: they can contain Auth cookies.
      - name: Stop disposable CI Supabase
        if: always()
        run: supabase stop
